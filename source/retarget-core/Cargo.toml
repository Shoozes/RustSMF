[package]
name = "rustsmf-retarget-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Portable mapping and retarget preflight analysis for RustSMF"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
advanced-bake = []

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150", features = ["float_roundtrip"] }
libm = "=0.2.16"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.126"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
