<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rig motion comparison</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#e8e8df;color:#242822;font:14px system-ui;display:grid;grid-template-rows:auto auto minmax(280px,1fr) auto;min-height:100dvh}header{display:flex;align-items:center;gap:14px;padding:11px 18px;border-bottom:1px solid #b6b9aa;flex-wrap:wrap}h1{font-size:17px;font-weight:600;margin:0 auto 0 0}select,button{font:inherit;padding:5px 9px;background:#fafaf4;color:inherit;border:1px solid #8f9687;border-radius:2px}button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid #385d31;outline-offset:3px}label{display:flex;align-items:center;gap:7px}#frame{width:210px}#labels{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;padding:10px 0}#labels span{border-right:1px solid #afb49e}#labels span:last-child{border:0}canvas{display:block;width:100%;height:100%;min-height:280px}footer{display:flex;align-items:flex-start;gap:10px;padding:8px 18px;font-size:12px;border-top:1px solid #b6b9aa}#status{flex:1}#error{color:#9c241d;font-weight:600}output{min-width:44px}details{max-width:min(620px,50vw)}summary{cursor:pointer}pre{max-height:180px;overflow:auto;background:#f5f5ed;border:1px solid #c4c7b8;padding:8px;white-space:pre-wrap;word-break:break-word}#copy{font-size:12px;padding:3px 7px}#diagnostics{position:relative}#diagnostics>summary{white-space:nowrap}#diagnostic-controls{position:absolute;z-index:20;right:0;top:calc(100% + 8px);min-width:320px;padding:10px 12px;background:#f5f5ed;border:1px solid #9aa08f;box-shadow:0 5px 14px #24282226;display:grid;gap:9px}#opacity{width:140px}#joint{min-width:190px}.legend{display:flex;gap:14px;font-size:12px;color:#4e5549}.swatch{display:inline-block;width:18px;height:3px;margin-right:5px;vertical-align:middle}.mapped{background:#00a9c1}.unmapped{background:#d18a00}@media(max-width:900px){header{gap:8px}h1{width:100%}#frame{width:120px}#labels{font-size:12px}#diagnostic-controls{position:fixed;right:12px;left:12px;top:auto;min-width:0}footer{display:block}details{max-width:none;margin-top:6px}}
  </style>
  <script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
</head>
<body>
  <header>
    <h1>Rig motion comparison</h1>
    <label>Motion <select id="clip" disabled></select></label>
    <button id="play" disabled>Play</button>
    <label>Frame <input id="frame" type="range" min="0" max="0" step="1" value="0" disabled><output id="position">0</output></label>
    <label>Mode <select id="mode"><option value="equal-height">Equal display height</option><option value="game-transform">Game transform</option></select></label>
    <label>View <select id="view"><option value="quad-ortho">Quad orthographic</option><option value="quarter">Three-quarter</option><option value="front">Front</option><option value="side">Side</option></select></label>
    <details id="diagnostics">
      <summary>Diagnostics</summary>
      <div id="diagnostic-controls">
        <label><input type="checkbox" id="bones"> Bone mapping</label>
        <label>Mesh opacity <input id="opacity" type="range" min="0.1" max="1" step="0.05" value="1"><output id="opacity-value">100%</output></label>
        <label>Joint <select id="joint" disabled></select></label>
        <label><input type="checkbox" id="joint-diagnostic" disabled> Joint axes and knee plane</label>
        <span class="legend" aria-label="Bone mapping legend"><span><i class="swatch mapped"></i>Mapped</span><span><i class="swatch unmapped"></i>Unmapped / target-only</span></span>
      </div>
    </details>
  </header>
  <div id="labels" aria-label="Compared model states"></div>
  <canvas aria-label="Three synchronized model views"></canvas>
  <footer>
    <span id="status">Loading verified models…</span>
    <span id="error" role="alert"></span>
    <details><summary>Capture receipt</summary><button id="copy" type="button">Copy receipt</button><pre id="receipt"></pre></details>
  </footer>
  <script type="module" src="/comparison.js"></script>
</body>
</html>
