[package]
license = "MIT"
name = "rustsmf"
version = "0.2.1"
description = "RustSMF - Modern SMF/GLB/FBX 3D model & animation tool (Tauri + Three.js)"
authors = ["Shoozes"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "=2.7.1"
rustsmf-retarget-core = { path = "../retarget-core" }

[features]
# This feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
